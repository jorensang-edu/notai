<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Center Card Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Rounded Squircle -->
    <rect x="-160" y="-160" width="320" height="320" rx="72" fill="url(#brandGrad)"/>

    <!-- Inner Shield Backdrop -->
    <path d="M0 -110 L100 -70 L100 20 C100 90 0 130 0 130 C0 130 -100 90 -100 20 L-100 -70 Z" fill="#090d16" fill-opacity="0.85"/>

    <!-- Stylized "N" Letterform -->
    <path d="M -52 65 L -52 -55 L -16 -55 L 18 15 L 18 -55 L 52 -55 L 52 65 L 16 65 L -18 -5 L -18 65 Z" fill="#ffffff"/>

    <!-- Small Academic Graduation Star/Cap Emblem Accent -->
    <polygon points="0,-82 8,-66 26,-66 12,-55 17,-38 0,-48 -17,-38 -12,-55 -26,-66 -8,-66" fill="#fbbf24"/>
  </g>

  <!-- Subtext Pill -->
  <rect x="176" y="430" width="160" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="256" y="454" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#93c5fd" letter-spacing="3">CEDFI</text>
</svg>
